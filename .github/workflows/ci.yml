name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - sauvegarde-panda-stable

# Annule le run précédent d'une même PR/branche si un nouveau push arrive pendant qu'il tourne.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache/setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Build (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitaires
        run: ./gradlew test --stacktrace

      - name: Lint Android (debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Rapports de test (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Rapports de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7
          if-no-files-found: ignore
